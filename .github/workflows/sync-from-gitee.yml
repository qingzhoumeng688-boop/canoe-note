name: Sync from Gitee

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync Gitee except GitHub workflows
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch master https://gitee.com/zhenhua_meng/canoe-notes.git /tmp/gitee-src
          rsync -a --delete --exclude '.git/' --exclude '.github/workflows/' /tmp/gitee-src/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "Gitee 无新变更"
            exit 0
          fi
          git commit -m "chore: sync from Gitee (keep GitHub workflows)"
          git push origin HEAD:master
